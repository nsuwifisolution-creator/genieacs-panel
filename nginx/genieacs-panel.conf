[Unit]
Description=GenieACS Panel Backend
After=network.target mongodb.service

[Service]
Type=simple
User=root
Group=root
WorkingDirectory=/opt/genieacs-panel/backend
Environment=NODE_ENV=production
EnvironmentFile=/opt/genieacs-panel/backend/.env
ExecStart=/usr/bin/node /opt/genieacs-panel/backend/src/server.js
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
